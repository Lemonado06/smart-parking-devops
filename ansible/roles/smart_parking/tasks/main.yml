---
- name: Install Java runtime
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: true

- name: Create service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ jar_src }}"
    dest: "{{ app_dir }}/smart-parking.jar"
    owner: "{{ app_user }}"
    mode: "0644"
  notify: Restart smart-parking

- name: Install systemd service file
  ansible.builtin.template:
    src: smart-parking.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart smart-parking

- name: Enable and start the service
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the app to listen on its port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    timeout: 60
